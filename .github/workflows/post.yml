name: post
on:
  schedule:
    - cron: "0 5,9,13,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 fonts-dejavu-core
          pip install pillow
      - run: python post.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.txt
          git commit -m "update state" || exit 0
          git push
        
