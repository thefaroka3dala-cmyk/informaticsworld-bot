name: news
on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 news.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.txt || true
          git add last_news.txt || true
          git commit -m "update seen" || exit 0
          git pull --rebase || true
          git push
